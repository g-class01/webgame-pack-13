(function() {
    function dummyBreak(fn) {
        if (typeof fn === 'function') fn();
        return Promise.resolve(true);
    }
    window.commercialBreak = window.commercialBreak || dummyBreak;
    window.rewardedBreak = window.rewardedBreak || dummyBreak;
    try {
        if (window.parent && window.parent !== window) {
            window.parent.commercialBreak = window.parent.commercialBreak || dummyBreak;
            window.parent.rewardedBreak = window.parent.rewardedBreak || dummyBreak;
        }
        if (window.top && window.top !== window) {
            window.top.commercialBreak = window.top.commercialBreak || dummyBreak;
            window.top.rewardedBreak = window.top.rewardedBreak || dummyBreak;
        }
    } catch(e) {}
})();
</script>

	/* Disable user selection to avoid strange bug in Chrome on Windows:
	* Selecting a text outside the canvas, then clicking+draging would
	* drag the selected text but block mouse down/up events to the engine.
	*/
	body {
	
		position: fixed; /* Prevent overscroll */
	
		margin:0;
		padding:0;
	}

	.canvas-app-container {
		width: 100%;
		height: 100%;
		position: absolute;
		align-items: center;
		justify-content: center;
		overflow: hidden;
	}

	.canvas-app-container:-webkit-full-screen {
		/* Auto width and height in Safari/Chrome fullscreen. */
		width: auto;
		height: auto;
	}

	#canvas {
		outline: none;
		border: 0;
		width: 100%;
		vertical-align: bottom;
	}

	#canvas-container {
		position: relative;
	}

	canvas:focus, canvas:active {
		outline: none;
		border: 0;
		ie-dummy: expression(this.hideFocus=true);
		-moz-outline-style: none;
	}

	div {
		-webkit-tap-highlight-color: rgba(0,0,0,0);
		-webkit-touch-callout: none;
		-webkit-user-select: none;
		-khtml-user-select: none;
		-moz-user-select: none;
		-ms-user-select: none;
		user-select: none;

	.loader,
	.loader:after {
		border-radius: 50%;
		width: 1vh;
		height: 1vh;
		margin: -0.5vh 0 0 -0.5vh;
		bottom: 8%;
		right: 5%;
	}
	.loader {
		font-size: 10px;
		position: absolute;
		text-indent: -9999em;
		border-top: 1.1em solid rgba(255, 255, 255, 0.2);
		border-right: 1.1em solid rgba(255, 255, 255, 0.2);
		border-bottom: 1.1em solid rgba(255, 255, 255, 0.2);
		border-left: 1.1em solid #ffffff;
		-webkit-transform: translateZ(0);
		-ms-transform: translateZ(0);
		transform: translateZ(0);
		-webkit-animation: load8 1.1s infinite linear;
		animation: load8 1.1s infinite linear;
	}
	@-webkit-keyframes load8 {
		0% {
		-webkit-transform: rotate(0deg);
		transform: rotate(0deg);
		}
		100% {
		-webkit-transform: rotate(360deg);
		transform: rotate(360deg);
		}
	}
	@keyframes load8 {
			0% {
				-webkit-transform: rotate(0deg);
				transform: rotate(0deg);
			}
			100% {
				-webkit-transform: rotate(360deg);
				transform: rotate(360deg);
			}
		}

	.progress .t {

	<script id='engine-setup' type='text/javascript'>
	var extra_params = {
		archive_location_filter: function( path ) {
			return ("archive" + path + "");
		},
		engine_arguments: [],
		custom_heap_size: 67108864,
		full_screen_container: "#canvas-container",

	var isAdBlock = 0;

	Module['INITIAL_MEMORY'] = extra_params.custom_heap_size;

	Module['onRuntimeInitialized'] = function() {
		Module.runApp("canvas", extra_params);
	};

	Module["locateFile"] = function(path, scriptDirectory)
	{
		// dmengine*.wasm is hardcoded in the built JS loader for WASM,
		// we need to replace it here with the correct project name.
		if (path == "dmengine.wasm" || path == "dmengine_release.wasm" || path == "dmengine_headless.wasm") {
			path = "BringmeCakes.wasm";
		}
		return scriptDirectory + path;
	};

	var is_iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
	var buttonHeight = 0;
	var prevInnerWidth = -1;
	var prevInnerHeight = -1;
	// Resize on init, screen resize and orientation change
	function resize_game_canvas() {
		// Hack for iOS when exit from Fullscreen mode
		if (is_iOS) {
			window.scrollTo(0, 0);
		}

		var app_container = document.getElementById('app-container');
		var game_canvas = document.getElementById('canvas');
		var innerWidth = window.innerWidth;
		var innerHeight = window.innerHeight - buttonHeight;
		if (prevInnerWidth == innerWidth && prevInnerHeight == innerHeight)
		{
			return;
		}
		prevInnerWidth = innerWidth;
		prevInnerHeight = innerHeight;
		var width = 853;
		var height = 480;
		var targetRatio = width / height;
		var actualRatio = innerWidth / innerHeight;
	
	
	
		//Fit
		if (actualRatio > targetRatio) {
			width = innerHeight * targetRatio;
			height = innerHeight;
			app_container.style.marginLeft = ((innerWidth - width) / 2) + "px";
			app_container.style.marginTop = "0px";
		}
		else {
			width = innerWidth;
			height = innerWidth / targetRatio;
			app_container.style.marginLeft = "0px";
			app_container.style.marginTop = ((innerHeight - height) / 2) + "px";
		}
	
	
		app_container.style.width = width + "px";
		app_container.style.height = height + buttonHeight + "px";
		game_canvas.width = width;
		game_canvas.height = height;
	}
	resize_game_canvas();
	window.addEventListener('resize', resize_game_canvas, false);
	window.addEventListener('orientationchange', resize_game_canvas, false);
	window.addEventListener('focus', resize_game_canvas, false);
	
	PokiSDK.gameLoadingStart();
	var progressText = document.getElementsByClassName("t")[0];
	Module.gameLoaded = false;
	Progress.addListener(function (percentage, text) {
		if (!isNaN(percentage))
		{ 
			var data = {};
			progressText.innerHTML = percentage.toFixed(2) + "%";
			data.percentageDone = percentage / 100;
			PokiSDK.gameLoadingProgress(data);
		}
		if (percentage == 100 && !Module.gameLoaded) {
			Module.gameLoaded = true;
			PokiSDK.gameLoadingFinished();
			document.getElementsByClassName("progress")[0].remove();
		}
	});
