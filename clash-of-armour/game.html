        return Promise.resolve(true);
    }
    window.commercialBreak = window.commercialBreak || dummyBreak;
    window.rewardedBreak = window.rewardedBreak || dummyBreak;

        if (window.parent && window.parent !== window) {
            window.parent.commercialBreak = window.parent.commercialBreak || dummyBreak;
            window.parent.rewardedBreak = window.parent.rewardedBreak || dummyBreak;
        }
        if (window.top && window.top !== window) {
            window.top.commercialBreak = window.top.commercialBreak || dummyBreak;
            window.top.rewardedBreak = window.top.rewardedBreak || dummyBreak;
        }
    } catch(e) {}
})();
</script>

	<script type="text/javascript">
		var isOnMobile = (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent));
	    var preLoadingProgress = 0;
		var isSDKReady = false; 
		var isGameLoaded = false;
		var adBlockerEnabled = false;
		var isRewardedAdPreloaded = true;
		var adRequested = "";
		var skipFirstAd = false;
		var adRequestsCount = 0;
		var isSpinnerDisplaying = true;
		var FIRST_GESTURE = false;
		var GAME_START_EVENT_PENDING = false;
		var LOADING_FINISH_EVENT_PENDING = false;
		var isLoadingFinished = false;
		function onPageReady()
		{
			
		}
		function Update_LoadingProgress(progress)
		{
			if(isSpinnerDisplaying)
			{
				isSpinnerDisplaying = false;
				document.getElementById("spinner").innertHTML = '';
				document.getElementById("spinner").style.display = "none";
				document.getElementById("logo").style.display = "none";
			}
			if(preLoadingProgress == progress)
				return;
			preLoadingProgress = progress;
			if(!isSDKReady)
				return;
			var data = {};
			data.percentageDone = progress;
			PokiSDK.gameLoadingProgress(data);
		}
		function On_GameStarted()
		{
			console.log("Game Loaded");
			if(isSpinnerDisplaying)
			{
				isSpinnerDisplaying = false;
				document.getElementById("spinner").innertHTML = '';
				document.getElementById("spinner").style.display = "none";
				document.getElementById("logo").style.display = "none";
			}
			if(!isLoadingFinished)
			{
				isLoadingFinished = true;
				if(isSDKReady)
				{
					PokiSDK.gameLoadingFinished();	
				}
				else
				{
					LOADING_FINISH_EVENT_PENDING = true;
				}
			}
			isGameLoaded = true;
		}
		PokiSDK.init().then(
		    () => {
		    	isSDKReady = true;
		        PokiSDK.setDebug(false);
		        console.log("PokiSDK initialized");
		        PokiSDK.gameLoadingStart();
		        if(LOADING_FINISH_EVENT_PENDING)
		        {
		        	PokiSDK.gameLoadingFinished();	
		        	LOADING_FINISH_EVENT_PENDING = false;
		        }
		    }   
		).catch(
		    () => {
		        console.log("Adblock enabled");
		        isSDKReady = true;
		        adBlockerEnabled = true;
		        PokiSDK.setDebug(false);
		        PokiSDK.gameLoadingStart();
		        if(LOADING_FINISH_EVENT_PENDING)
		        {
		        	PokiSDK.gameLoadingFinished();	
		        	LOADING_FINISH_EVENT_PENDING = false;
		        }
		    }   
		);
		function On_MatchStart() {
			console.log("Match Started");
			if(isSDKReady)
			{
				if(FIRST_GESTURE)
				{
					PokiSDK.gameplayStart();
				}
				else
				{
					GAME_START_EVENT_PENDING = true;
				}
				
			}
		}
		function On_MatchEnd() {
			console.log("Match Ended");
			if(isSDKReady)
			{
				PokiSDK.gameplayStop();
			}
		}
		function showAd()
		{
			if(isSDKReady)
			{
				if(adBlockerEnabled)
				{
					goToGame();
				}
				else
				{
					PokiSDK.commercialBreak().then(() => {
						goToGame();
					}).catch(() => {
						goToGame();
					});
				}
			}
			else
			{
				goToGame();
			}
		}
		function goToGame()
		{
			console.log('Go To Game');
			c3_callFunction("On_Ad_Served");
		}
		function HappyTime(intensity)
		{
			console.log("Happy Time <" +intensity + ">");
			if(isSDKReady)
		  	{
		  		PokiSDK.happyTime(intensity);
		  	}
		}
		function isAdBlockerEnabled()
		{
			if(adBlockerEnabled)
				return 1;
			else
				return 0;
		}
		function PreloadRewarededAd()
		{
			if(!isSDKReady)
				return;
			isRewardedAdPreloaded = true;
		}
		function showRewardedAd()
		{
			if(adBlockerEnabled)
			{
				if(isGameLoaded)
					CloseRewardedAd();
			}
			else
			{
				if(isSDKReady)
				{
					PokiSDK.rewardedBreak().then((success) => {
					    if(success) {
					        c3_callFunction("On_RewardedAd_Served");
					    } else {
					        CloseRewardedAd();
					    }
					});
				}
				else
				{
					CloseRewardedAd();
				}
			}
		}
		function CloseRewardedAd()
		{
			adRequested = "";
	    	c3_callFunction("On_RewardedAd_Closed");
	    	isRewardedAdPreloaded = false;
	    	PreloadRewarededAd();
		}
	</script>
	<script type="text/javascript">
		var gameScreens = {};
		const SCREENs = {
		    ROTATE : "rotate"
		}
		var ORIENTATIONs = {
			PORTRAIT : 0,
			LANDSCAPE : 1,
			BOTH : 2
		}
		const RESCALE_MODEs = {
			WIDTH : 0,
			HEIGHT : 1,
			MIN : 2,
			MAX : 3,
			VALUE : 4
		}
		var UI_SCALE = 0.75;
		var CANVAS_WIDTH = 1920;
		var CANVAS_HEIGHT = 1080;
		var rescaleMode = RESCALE_MODEs.MIN;
		var screenOrientation = ORIENTATIONs.LANDSCAPE;
		var CANVAS_AspectRatio = CANVAS_WIDTH/CANVAS_HEIGHT;
		var aspectRatio = 0;
		var screenWidth = 0;
		var screenHeight = 0;
		function Resize()
		{
			screenWidth = Math.max(document.documentElement.clientWidth, window.innerWidth || 0);
			screenHeight= Math.max(document.documentElement.clientHeight, window.innerHeight || 0);
			aspectRatio = screenWidth/screenHeight;
			console.log(screenWidth +"<>"+ screenHeight);
			switch(rescaleMode)
			{
				case RESCALE_MODEs.WIDTH:
				UI_SCALE = screenWidth/CANVAS_WIDTH;
				break;
				case RESCALE_MODEs.HEIGHT:
				UI_SCALE = screenHeight/CANVAS_HEIGHT;
				break;
				case RESCALE_MODEs.MIN:
				UI_SCALE = Math.min(screenWidth/CANVAS_WIDTH,screenHeight/CANVAS_HEIGHT)
				break;
				case RESCALE_MODEs.MAX:
				UI_SCALE = Math.max(screenWidth/CANVAS_WIDTH,screenHeight/CANVAS_HEIGHT)
				break;
			}
			UI_SCALE = UI_SCALE.toFixed(2);
			if(isOnMobile)
			{
				if(!gameScreens[SCREENs.ROTATE])
					return;
				switch(screenOrientation)
				{

					case ORIENTATIONs.PORTRAIT:
					if(screenWidth > screenHeight)
						gameScreens[SCREENs.ROTATE].style.display = "block";	
					else
						gameScreens[SCREENs.ROTATE].style.display = "none";
					
					break;

					case ORIENTATIONs.LANDSCAPE:
					if(screenHeight > screenWidth)
						gameScreens[SCREENs.ROTATE].style.display = "block";	
					else
						gameScreens[SCREENs.ROTATE].style.display = "none";
					break;
				}
			}
		}
		window.addEventListener('resize', function(event){
		  Resize();
		});
		function InitScreens()
		{
			gameScreens[SCREENs.ROTATE] = document.getElementById("screen_"+SCREENs.ROTATE);
			Resize();
		}
	</script>

			if(GAME_START_EVENT_PENDING)

				PokiSDK.gameplayStart();
				document.removeEventListener("pointerdown", gestureHandler);
			}
		};
