<!DOCTYPE html>
<html lang="en-us">
<head>
<script>
(function() {
    function dummyBreak(fn) {
        if (typeof fn === 'function') fn();
        return Promise.resolve(true);
    }
    window.commercialBreak = window.commercialBreak || dummyBreak;
    window.rewardedBreak = window.rewardedBreak || dummyBreak;
    try {
        if (window.parent && window.parent !== window) {
            window.parent.commercialBreak = window.parent.commercialBreak || dummyBreak;
            window.parent.rewardedBreak = window.parent.rewardedBreak || dummyBreak;
        }
        if (window.top && window.top !== window) {
            window.top.commercialBreak = window.top.commercialBreak || dummyBreak;
            window.top.rewardedBreak = window.top.rewardedBreak || dummyBreak;
        }
    } catch(e) {}
})();
</script>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Wood Craft</title>
  <script src="poki-sdk.js"></script>
  <script>window.open = function () {}; window.NOSW = true;</script>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }
    #unity-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
    #unity-canvas { width: 100%; height: 100%; background: #000; display: block; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>
  <script src="Build/Web.loader.js"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    createUnityInstance(canvas, {
      dataUrl: "Build/Web.data",
      frameworkUrl: "Build/Web.framework.js",
      codeUrl: "Build/Web.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "npu",
      productName: "Wood Craft",
      productVersion: "1.0.0"
    }).then(function (instance) {
      window.unityInstance = instance;
      console.log("Wood Craft Unity 2020 instance created successfully!");
    }).catch(function (message) {
      console.error("Wood Craft Unity error:", message);
    });
  </script>
</body>
</html>
